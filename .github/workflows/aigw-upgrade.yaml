name: AI Gateway candidate manifests
on:
  pull_request:
    paths: ['apps/kong-ai-gateway*.yaml', 'platform/kong-ai-gateway*/**', 'platform/kong-gateway/httproute-aigw.yaml', 'scripts/validate-aigw-upgrade.py', '.github/workflows/aigw-upgrade.yaml', 'renovate.json']
  push:
    branches: [main]
    paths: ['apps/kong-ai-gateway*.yaml', 'platform/kong-ai-gateway*/**', 'platform/kong-gateway/httproute-aigw.yaml', 'scripts/validate-aigw-upgrade.py', '.github/workflows/aigw-upgrade.yaml', 'renovate.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate-aigw-upgrade.py
