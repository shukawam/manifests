# 同じ値を Konnect 側の ai-prompt-compressor ポリシー (config.headroom.proxy_token) にも
# 手で設定する。トークン未設定だと /v1/* がクラスタ内から無認証で叩けるオープンリレーになる。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headroom-proxy-token
  namespace: kong
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  refreshInterval: 1h
  target:
    name: headroom-proxy-token
  data:
    - secretKey: token
      remoteRef:
        key: headroom-proxy-token
