apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: kong
spec:
  # セッション単位の圧縮状態はプロセス内に持つため、同一会話のターンは必ず同じプロセスに
  # 届かなければならない。replicas を増やしたり RollingUpdate で新旧 Pod を並走させたり
  # すると、圧縮済みターンを認識できず再圧縮されて prefix cache が崩れる。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headroom
    spec:
      securityContext:
        # イメージの USER は名前 (nonroot) 指定なので、runAsNonRoot を検証させるには数値 UID が要る
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:0.39.1-slim-nonroot
          # イメージ既定の HEADROOM_HOST=127.0.0.1 のままだと Service から届かない
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
          ports:
            - name: http
              containerPort: 8787
          env:
            # /v1/compress は既定で loopback 以外に 404 を返す。AI Gateway は別 Pod なので必須
            - name: HEADROOM_COMPRESS_ALLOW_REMOTE
              value: "1"
            - name: HEADROOM_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headroom-proxy-token
                  key: token
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
