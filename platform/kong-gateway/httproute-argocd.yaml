# argo-cd の Application ではなくここに置く。argo-cd は sync-wave -1 で、
# その時点では Gateway API の CRD がまだ存在しないため。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: https
  hostnames:
    - argocd.gke.shukawam.me
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      timeouts:
        request: 60s
        backendRequest: 60s
