# argo-cd の Application ではなくここに置く。argo-cd は sync-wave -1 で、
# その時点では Gateway API の CRD がまだ存在しないため。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # https listener 専用ルートに HTTP で来たリクエストへ Kong が返すコード
    # (既定 426) を 301 にして、リダイレクト用の HTTPRoute を別に作らずに済ませる。
    # 分けてはいけない: traditional ルーターは protocols=["http"] のルートから
    # HTTPS を除外しないため、同一 host/path の両ルートがあると無限リダイレクトになる。
    konghq.com/https-redirect-status-code: "301"
spec:
  # group / kind / weight / matches は CRD 既定値だが、省略すると実機と git に
  # 恒常差分が出て Application が OutOfSync のまま固定される。
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
      sectionName: https
  hostnames:
    - argocd.gke.shukawam.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      timeouts:
        request: 60s
        backendRequest: 60s
