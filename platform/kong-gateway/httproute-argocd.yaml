# argo-cd の Application ではなくここに置く。argo-cd は sync-wave -1 で、
# その時点では Gateway API の CRD がまだ存在しないため。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Kong ネイティブの HTTP -> HTTPS リダイレクト。
    # この HTTPRoute は https listener だけに attach するので Kong ルートは
    # protocols=["https"] になる。Kong は https 専用ルートに HTTP で来た
    # リクエストへ https_redirect_status_code を返す（既定 426）。
    # ここを 301 にすることで、リダイレクト専用の HTTPRoute を別に作らずに
    # HTTP アクセスを HTTPS へ誘導できる。
    #
    # リダイレクト専用ルートを分けてはいけない。Kong は
    # KONG_ROUTER_FLAVOR=traditional で動いており、traditional ルーターは
    # protocols=["http"] のルートから HTTPS リクエストを除外しない。
    # 同一 host/path の http ルートと https ルートを両方作ると HTTPS でも
    # リダイレクト側にマッチしてしまい、無限リダイレクトになる。
    #
    # KIC は kongstate.Route.overrideByAnnotation で HTTPRoute の
    # アノテーションを読むため、Gateway API でもこの annotation が効く。
    konghq.com/https-redirect-status-code: "301"
spec:
  # group / kind / weight / matches は CRD の既定値だが、あえて明示する。
  # 省略すると API サーバが既定値を埋めた実機と git の間に恒常的な差分が生じ、
  # Application が OutOfSync のまま固定され selfHeal が再 apply を繰り返す。
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
      sectionName: https
  hostnames:
    - argocd.gke.shukawam.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      timeouts:
        request: 60s
        backendRequest: 60s
