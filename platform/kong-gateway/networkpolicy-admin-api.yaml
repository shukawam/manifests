# kong/ingress チャートの Admin API (8444) にはクライアント証明書検証が無く、
# チャート同梱の NetworkPolicy も無い。素のままだとクラスタ内の任意の Pod が
# Admin API に到達し、Argo CD を front する Gateway の設定を書き換えられるため、
# ネットワーク到達性で塞ぐ。
#
# セレクタは helm template のレンダリング結果 (Deployment の Pod ラベル) に
# 合わせている。release name を変えたらここも変えること。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kong-admin-api-limit
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: kong-ingress
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
              app.kubernetes.io/instance: kong-ingress
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 8444
