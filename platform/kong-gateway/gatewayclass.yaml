apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # KIC は unmanaged モードでしか Gateway を扱わない。このアノテーションが無いと
    # 紐づく Gateway は status も書かれずエラーログも出ずに無視される。
    # 値は任意の非空文字列でよい。
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  # 誤った値でも GatewayClass は作成でき、Gateway が黙って Accepted=False に
  # なるだけなので、変更時は実機で status を確認すること。
  controllerName: konghq.com/kic-gateway-controller
