apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.gke.shukawam.me"
      tls:
        mode: Terminate
        certificateRefs:
          # group も CRD 既定値（コア API グループ = 空文字）だが明示する。
          - group: ""
            kind: Secret
            name: gke-shukawam-me-tls
      allowedRoutes:
        namespaces:
          from: All
