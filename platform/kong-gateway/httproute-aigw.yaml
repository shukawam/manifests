# argocd の HTTPRoute と同じ理由でここに置く (sync-wave -1 の時点では
# Gateway API の CRD がまだ無い)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aigw
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # http -> https のリダイレクト。詳細は httproute-argocd.yaml 参照。
    konghq.com/https-redirect-status-code: "301"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
      sectionName: https
  hostnames:
    - aigw.gke.shukawam.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kong-ai-gateway-kong-ai-gateway-proxy
          port: 8000
          weight: 1
      # LLM のストリーミング応答は所要時間が読めないため長めにする。0s
      # (仕様上は無効化) は KIC 3.5.13 が Kong の timeout に 0 として渡し、
      # スキーマに弾かれて設定投入が丸ごと失敗するので使えない
      # (docs/known-issues.md 参照)。
      timeouts:
        request: 3600s
        backendRequest: 3600s
