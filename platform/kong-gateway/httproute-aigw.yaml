# argocd の HTTPRoute と同じ理由でここに置く（Gateway API CRD が
# argo-cd の sync-wave -1 時点でまだ存在しない）。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aigw
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # http -> https のネイティブリダイレクト。詳細は httproute-argocd.yaml のコメント参照。
    konghq.com/https-redirect-status-code: "301"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
      sectionName: https
  hostnames:
    - aigw.gke.shukawam.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kong-ai-gateway-kong-ai-gateway-proxy
          port: 8000
          weight: 1
      # LLM のストリーミング応答は完了までに要する時間が読めないため、
      # request/backendRequest ともに 0s (Gateway API 仕様上「タイムアウト無効化」)
      # にする。README の従来方針 (AI Gateway を Gateway API から切り離す) は
      # このタイムアウト無効化とセットで撤回した — 撤回の経緯は known-issues.md 参照。
      timeouts:
        request: 0s
        backendRequest: 0s
