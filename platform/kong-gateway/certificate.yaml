apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gke-shukawam-me
  namespace: kong
  annotations:
    # gateway.yaml と同じ wave にする。Argo CD は Certificate のヘルスチェックを
    # 持つため、wave を分けると発行完了まで Gateway が作られない。発行は手動の
    # NS 委任が前提なので、それが済むまで何も進まなくなる。
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: gke-shukawam-me-tls
  # Kong は Secret の informer キャッシュを konghq.com/secret=true で絞り込む。
  # このラベルが無い Secret は一切見えず、listener が InvalidCertificateRef
  # ("Secret ... not found") のまま止まる。kubectl get では引けるので気づきにくい。
  secretTemplate:
    labels:
      konghq.com/secret: "true"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: "*.gke.shukawam.me"
  dnsNames:
    # apex (gke.shukawam.me) は含めない。A レコードも listener hostname も
    # apex を持たないため、SAN に入れても使えない。
    - "*.gke.shukawam.me"
