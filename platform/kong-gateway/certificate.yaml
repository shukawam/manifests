apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gke-shukawam-me
  namespace: kong
  annotations:
    # gateway.yaml と同じ wave にする。Argo CD は cert-manager.io/Certificate
    # のヘルスチェックを持つため、wave を分けると Let's Encrypt の発行が
    # 終わるまで Gateway (延いては Kong の DataPlane / LoadBalancer) が
    # 作られなくなる。発行は手動の NS 委任が前提のため、それが済むまで
    # 静的 IP の annotation 確認すらできなくなってしまう。同じ wave なら
    # Gateway は即座に作られ、Secret が現れた時点で Kong が listener を
    # Programmed にする (下の secretTemplate のラベルが付いていることが前提)。
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: gke-shukawam-me-tls
  # Kong Operator は Secret の informer キャッシュを konghq.com/secret=true で
  # 絞り込んでいる。このラベルが無い Secret はオペレータから**一切見えず**、
  # Gateway の listener が InvalidCertificateRef ("Secret ... not found") のまま
  # 永久に止まる。kubectl get では取得できるので発覚しにくい。
  # Konnect が出力する Secret にこのラベルが付いているのはこのためで、
  # cert-manager が発行する TLS Secret にも同じラベルが要る。
  secretTemplate:
    labels:
      konghq.com/secret: "true"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: "*.gke.shukawam.me"
  dnsNames:
    # apex (gke.shukawam.me) は含めない。ワイルドカードは自分自身の owner name には
    # マッチせず、apex 用の A レコードも存在せず、gateway.yaml の listener hostname
    # (*.gke.shukawam.me) も apex を含まない。構造上使えない SAN のため外している。
    - "*.gke.shukawam.me"
