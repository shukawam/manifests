# apiVersion は v2beta1 を使用する（v1beta1 は deprecated: true / storage: false）。
#
# spec.controlPlaneOptions は意図的に書いていない（書き忘れではない）:
#   - v2beta1 の controlPlaneOptions には deployment フィールドが無い
#     （deployment があるのは v1beta1 の controlPlaneOptions のみ）
#   - structural schema のため、書いても API サーバーに黙って prune され効かない
#   - v2beta1 の GatewayConfiguration にコントロールプレーンの
#     resources を設定する手段は現状存在しない
apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  dataPlaneOptions:
    deployment:
      replicas: 2
      podTemplateSpec:
        spec:
          containers:
            - name: proxy
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
    network:
      services:
        ingress:
          type: LoadBalancer
          # この CRD は spec.loadBalancerIP を公開していないため、
          # 静的 IP の固定は annotation 経由しか手段がない。
          # 効かない場合の対処は docs/terraform-requirements.md のフォールバック参照。
          annotations:
            cloud.google.com/l4-rbs: "enabled"
            networking.gke.io/load-balancer-ip-addresses: shukawam-gke-gateway
