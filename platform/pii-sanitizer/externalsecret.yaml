# imagePullSecrets は Pod から直接参照される実体が要るため、konnect-api-token
# (クラスタ外でのみ使う) とは違い ESO 経由で同期する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pii-sanitizer-cloudsmith
  namespace: kong
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  refreshInterval: 1h
  target:
    name: pii-sanitizer-cloudsmith
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: pii-sanitizer-cloudsmith-dockerconfigjson
