# Overlay on platform/kong-ai-gateway/values.yaml; never use by itself.
# Start with an A/A rehearsal. Renovate proposes updates to this file only.
# Readiness and drain settings are inherited from the stable values.
fullnameOverride: kong-ai-gateway-candidate
image:
  # 現行が ubuntu 系の 2.2.0 なので、distroless 化も候補でまとめて検証する
  repository: kong/kong-ai-gateway
  tag: "2.3.0-distroless"
# AG-1914 の検証: Pod またぎで全損し、アフィニティで止まることを見るため 2 にしている
replicaCount: 2
autoscaling:
  enabled: false
deployment:
  # distroless 像には rm が無く、チャート既定の clear-stale-pid init container が exec で落ちる。
  # distroless の entrypoint は kong start を経由せず nginx を直接 exec するので、stale pid で
  # 起動を拒否されることもなく、消す必要自体がない
  kong:
    initContainers:
      clearStalePid:
        enabled: false
  serviceAccount:
    create: false
    name: kong-ai-gateway-kong-ai-gateway
# Reuse the KSA/GSA binding and the certificate already registered in Konnect.
# The two releases must not own the same ServiceAccount or Certificate.
certificates:
  enabled: false
secretVolumes:
  - kong-ai-gateway-kong-ai-gateway-cluster-cert
env:
  cluster_cert: /etc/secrets/kong-ai-gateway-kong-ai-gateway-cluster-cert/tls.crt
  cluster_cert_key: /etc/secrets/kong-ai-gateway-kong-ai-gateway-cluster-cert/tls.key
  cluster_dp_labels: "env:sandbox,track:candidate"
  # AG-1914 の検証: どの Pod が処理したかを応答ヘッダーで見るため一時的に付ける
  nginx_proxy_add_header: "X-Served-By $hostname"
proxy:
  type: ClusterIP
  annotations:
    # platform/kong-gateway/kongupstreampolicy-aigw-sticky.yaml
    konghq.com/upstream-policy: aigw-sticky
  ingress:
    enabled: false
