# Konnect が出力したセットアップコマンドの --set をそのまま values に落としたもの
image:
  tag: "2.3.0-rc.2"

env:
  ENABLE_CONTROLLER_KONNECT: true
  ENABLE_CONTROLLER_AIGATEWAYDATAPLANE: true

# 既定 (false) だと templates/kong-operator-ca.yaml が
#   {{ if not (lookup "v1" "Secret" ...) }}{{ $ca := genCA ... }}
# を通り、Argo CD の helm template では lookup が常に nil を返すため
# reconcile のたびに新しい CA が生成されて恒久 OutOfSync になる。
# チャートの values コメント自身も production では cert-manager を推奨している。
#
# 注意: この chart では webhooks / certificateAuthority は
# `global.webhooks` / `global.certificateAuthority` 配下にある
# (`helm show values kong/kong-operator --version 1.4.0-rc.1` で確認済み)。
# トップレベルに置くと無視され genCA が走り続けるため global 配下に置くこと。
global:
  webhooks:
    options:
      certManager:
        enabled: true
  certificateAuthority:
    options:
      certManager:
        enabled: true

# limits も明示する。requests だけ上書きするとチャート既定の
# limits (cpu 500m / memory 256Mi) がそのまま残り、requests と同値になって
# 余裕がゼロになる。このオペレータは全 namespace を監視し Gateway API /
# Kong / Konnect / AI Gateway の全コントローラを動かすため、
# コールドスタート時の informer キャッシュ構築で 256Mi を超えて OOMKilled になる
# (実機で 23 回連続の CrashLoopBackOff を確認)。
# 温まった後の定常状態では収まるため、Pod が再起動するまで露見しない。
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
