apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-node
  namespace: opentelemetry
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mode: daemonset
  serviceAccount: otel-collector
  # /var/log/pods の読み取りに必要。GKE Standard だからできる (Autopilot では不可)
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  config:
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
      # hostmetrics は使わない。/hostfs のマウントと root_path が無いままだと
      # cpu / load / memory / network の各スクレイパーは「ノード」ではなく
      # Collector コンテナ自身の cgroup 視点の値（100m / 512Mi に制限された
      # Pod の使用量）を返してしまい、それがノードのメトリクスとして
      # Cloud Monitoring に記録される。disk / filesystem を外したのと同じ理由。
      # ノードの cpu / memory / network は kubeletstats の node メトリクス
      # グループで正しく取れるため、hostmetrics 自体を削除する
      # （失うのは load average のみ。/hostfs 全体をマウントする権限昇格も避けられる）。
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        # Collector 自身（otel-node-collector）と、その先で中継している
        # otel-gateway-collector のログを除外する。gateway 側だけ除外を
        # 忘れると、gateway のログが収集されて gateway 自身を経由して
        # エクスポートされ、エクスポートでエラーが出た際にそのログ行が
        # 同じ exporter に戻る増幅ループになる（無限ループではないが、
        # 最もノイズを見たくないタイミングで最も騒がしくなる）。
        exclude:
          - "/var/log/pods/opentelemetry_otel-node-collector*/*/*.log"
          - "/var/log/pods/opentelemetry_otel-gateway-collector*/*/*.log"
        start_at: end
        include_file_path: true
        include_file_name: false
        retry_on_failure:
          enabled: true
        operators:
          # containerd / CRI-O / docker のどれでも解釈できる
          - id: container-parser
            type: container
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
        # k8s.pod.ip は filelog の container operator が付与しない属性なので使えない。
        # kubeletstats はローカル pull で接続コンテキストが無いため from: connection
        # も使えない。UID、無ければ (namespace, pod 名) で関連付ける。
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.namespace.name
              - from: resource_attribute
                name: k8s.pod.name
      resourcedetection:
        detectors: [env, gcp]
        timeout: 10s
        override: false
      batch:
        send_batch_size: 1000
        timeout: 10s
    exporters:
      otlp:
        endpoint: otel-gateway-collector.opentelemetry.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
