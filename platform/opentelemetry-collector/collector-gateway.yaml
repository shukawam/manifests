apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: opentelemetry
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  mode: deployment
  # k8s_cluster receiver は重複計上を避けるため必ず 1 レプリカ
  replicas: 1
  serviceAccount: otel-collector
  env:
    - name: NEW_RELIC_LICENSE_KEY
      valueFrom:
        secretKeyRef:
          name: new-relic
          key: license-key
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8s_cluster:
        collection_interval: 30s
        allocatable_types_to_report: [cpu, memory]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
        # from: connection は使わない。node collector 経由のデータは接続元が
        # 発信元 Pod ではなく node collector 自身になるため、k8s_cluster の
        # node メトリクスが otel-node-collector の Pod メトリクスとして
        # 誤記録される (エラーも欠落も出ないため気付けない)。
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.namespace.name
              - from: resource_attribute
                name: k8s.pod.name
      resourcedetection:
        detectors: [env, gcp]
        timeout: 10s
        override: false
      batch:
        send_batch_size: 1000
        timeout: 10s
      # Kong は「その値が最後に更新された時刻」を datapoint のタイムスタンプに使う。
      # 起動時に一度だけ立つゲージ (kong.cp.connection.status など) はそのまま古くなり続け、
      # New Relic の受け付ける時間窓から外れて捨てられるので、送信時刻で上書きする。
      # GMP 向けのパイプラインには入れない (本来の収集時刻を失う)
      transform/kong:
        metric_statements:
          - context: datapoint
            statements:
              - set(datapoint.time, Now())
    exporters:
      # メトリクスは GMP へ。googlecloud だと custom.googleapis.com の
      # メトリクス記述子上限とコストに当たる。
      googlemanagedprometheus:
        project: gcp-fieldeng-dev
      googlecloud:
        project: gcp-fieldeng-dev
        log:
          default_log_name: opentelemetry-collector
      otlp_http/newrelic:
        endpoint: https://otlp.nr-data.net
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        retry_on_failure:
          enabled: true
    service:
      pipelines:
        metrics:
          receivers: [otlp, k8s_cluster]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlemanagedprometheus]
        # transform/kong のためだけに GMP 側と分けている。receiver ID が同一なので
        # k8s_cluster は 1 インスタンスが両パイプラインへ fan-out する (二重収集にならない)
        metrics/newrelic:
          receivers: [otlp, k8s_cluster]
          processors: [memory_limiter, k8sattributes, resourcedetection, transform/kong, batch]
          exporters: [otlp_http/newrelic]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlecloud, otlp_http/newrelic]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlecloud, otlp_http/newrelic]
