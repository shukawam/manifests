apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      # kubeletstats は kubelet を直接叩くため nodes/stats で足りる。nodes/proxy は
      # 任意の kubelet エンドポイントへの GET を許すため付与しない。
      - nodes/stats
      - services
      - endpoints
      - events
      - replicationcontrollers
      - resourcequotas
      - persistentvolumes
      - persistentvolumeclaims
      # 無いと informer が実行時に 403 になり、クラスタメトリクスが静かに欠落する
      - namespaces/status
      - nodes/spec
      - pods/status
      - replicationcontrollers/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: opentelemetry
