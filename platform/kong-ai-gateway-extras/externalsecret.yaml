# Konnect API トークンを Secret Manager から取得し、Kong Operator が要求する
# ラベル (konghq.com/credential, konghq.com/secret) を付けた Secret として同期する。
# ESO は target.template を書かないとラベルを引き継がないため、
# template.metadata.labels が無いと Kong Operator が Secret を認識できない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konnect-api-auth
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: konnect-api-auth-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          konghq.com/credential: konnect
          konghq.com/secret: "true"
  data:
    - secretKey: token
      remoteRef:
        key: konnect-api-token
