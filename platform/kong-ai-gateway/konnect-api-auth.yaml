# konnectapiauthconfigurations.konnect.konghq.com (v1alpha1, storage) のスキーマと
# 突き合わせ済み: spec.{type,secretRef.name,serverURL} は実物に一致する。
kind: KonnectAPIAuthConfiguration
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: konnect-api-auth
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: secretRef
  secretRef:
    name: konnect-api-auth-secret
  serverURL: us.api.konghq.com
