# Konnect hybrid 接続設定。値は Konnect 上の AI Gateway
# c279b965-a577-47a9-8e0e-0931b44d6994 (sandbox-ai-gateway) の実測値。
env:
  konnect_mode: "on"
  cluster_mtls: pki
  cluster_control_plane: "d15b661be0.us.cp.konghq.com:443"
  cluster_server_name: "d15b661be0.us.cp.konghq.com"
  cluster_telemetry_endpoint: "d15b661be0.us.tp.konghq.com:443"
  cluster_telemetry_server_name: "d15b661be0.us.tp.konghq.com"
  # Konnect の Data plane nodes 一覧に表示されるラベル (key:value のカンマ区切り)
  cluster_dp_labels: "env:sandbox"
  # certificates.cluster.enabled: true にすると、このパスへ自動的に Secret が
  # マウントされる (secretVolumes は使わない)
  cluster_cert: /etc/cert-manager/cluster/tls.crt
  cluster_cert_key: /etc/cert-manager/cluster/tls.key

image:
  repository: kong/kong-ai-gateway
  # チャート既定の repository は kong/kong-ai-gateway-dev
  tag: "2.0.2"

# ノードプールが GKE_METADATA のため、このアノテーションが無い Pod は未マッピングの
# Workload Identity 連合 ID として認証され (権限を一切持たない)、ノードの既定 SA には
# フォールバックしない。GSA 側の権限は bootstrap/gke の
# google_service_account.kong_ai_gateway で設定している。
# serviceAccount がチャートでは deployment 配下にネストされている点に注意。
deployment:
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: shukawam-kong-ai-gateway@gcp-fieldeng-dev.iam.gserviceaccount.com

proxy:
  # TLS 終端は Kong Gateway 側のワイルドカード証明書が行うため、この Service は
  # クラスタ内部からのみ到達できればよい。ルーティングは
  # platform/kong-gateway/httproute-aigw.yaml。
  type: ClusterIP
  http:
    servicePort: 8000
  tls:
    enabled: false

# Konnect hybrid mTLS 用の DP クライアント証明書。
# 【要確認】この証明書は Konnect に Dataplane Certificate として登録する必要があり、
# 未登録の間は hybrid 接続が 401 になる (docs/known-issues.md 参照)。
certificates:
  enabled: true
  # cert-manager の自動更新は Konnect 側の再登録を伴わないため、既定の 90 日のままだと
  # 更新のたびに気づかれずに 401 へ落ちる時限爆弾になる。
  # 罠: templates/certificate.yaml は per-service の duration/renewBefore を読まず、
  # 常にこの global 値だけを使う (個別指定は黙って無視される)。
  duration: 87600h # 10 年 (365 * 24 * 10)
  # 実質ローテーションを起こさない値。万一 9 年後まで生き延びた場合でも、更新の
  # 1 年前から Konnect 再登録を計画できる猶予を残す。
  renewBefore: 8760h # 1 年 (365 * 24)
  # certificates.enabled: true にすると admin/proxy の証明書もチャート既定で発行され、
  # Konnect 登録対象がどれか分からなくなるため落とす。
  admin:
    enabled: false
  proxy:
    enabled: false
  cluster:
    enabled: true
    # チャート 0.1.0 は README の記述と違い、未指定時のビルトイン自己署名 Issuer への
    # fallback を持たない (issuerRef が出力されず Certificate が拒否される)。
    clusterIssuer: selfsigned
