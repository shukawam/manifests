env:
  konnect_mode: "on"
  cluster_mtls: pki
  cluster_control_plane: "d15b661be0.us.cp.konghq.com:443"
  cluster_server_name: "d15b661be0.us.cp.konghq.com"
  cluster_telemetry_endpoint: "d15b661be0.us.tp.konghq.com:443"
  cluster_telemetry_server_name: "d15b661be0.us.tp.konghq.com"
  cluster_dp_labels: "env:sandbox"
  cluster_cert: /etc/cert-manager/cluster/tls.crt
  cluster_cert_key: /etc/cert-manager/cluster/tls.key
  tracing_instrumentations: all
  tracing_sampling_rate: "1.0"
  nginx_main_worker_shutdown_timeout: "3600s"

image:
  repository: kong/kong-ai-gateway
  tag: "2.2.0"

deployment:
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: shukawam-kong-ai-gateway@gcp-fieldeng-dev.iam.gserviceaccount.com

proxy:
  type: ClusterIP
  http:
    servicePort: 8000
  tls:
    enabled: false

certificates:
  enabled: true
  duration: 87600h # 10 年 (365 * 24 * 10)
  renewBefore: 8760h # 1 年 (365 * 24)
  admin:
    enabled: false
  proxy:
    enabled: false
  cluster:
    enabled: true
    clusterIssuer: selfsigned

# chart 0.1.0 は AI Gateway 2.x を Gateway 3.3 未満と判定し、/status/ready を
# /status に文字列置換する。クエリ文字列を付けると置換を外れ、設定ロード後に
# だけ Ready になる (nginx の location マッチはクエリを見ない)。
readinessProbe:
  httpGet:
    path: /status/ready?source=kubelet
    port: status
    scheme: HTTP
# 長い SSE を切らずに drain する。--wait は endpoint 伝播待ち、--timeout が
# 強制終了までの猶予 (chart 既定の --wait=15 のみだと 10 秒で強制終了される)。
terminationGracePeriodSeconds: 3630
lifecycle:
  preStop:
    exec:
      command: [kong, quit, "--wait=15", "--timeout=3600"]
