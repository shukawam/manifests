# konnectaigateways.konnect.konghq.com (v1alpha1, storage) のスキーマと突き合わせ済み:
# spec.{source,mirror.konnect.id,konnect.authRef.name} は実物に一致する。
# id は Konnect Control Plane の UUID（テナント固有の実値。変更しない）。
kind: KonnectAIGateway
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  source: Mirror
  mirror:
    konnect:
      id: 87ffec73-4403-49c8-bc99-81dc47fce093
  konnect:
    authRef:
      name: konnect-api-auth
