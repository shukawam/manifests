# kong/ingress は薄いラッパで、実体は kong サブチャートを
# controller (KIC) と gateway (Kong Gateway) の 2 エイリアスで
# 2 回インスタンス化する構成になっている。

controller:
  ingressController:
    image:
      # ★ 浮動タグ (3.5) を使わないこと。
      # KIC 3.4.0 で混入した SNI 生成の不具合により、TLS 証明書を付けた Gateway が
      # 宣言的設定の投入を全件失敗させ、その Gateway のルーティングが全停止する
      # (docs/known-issues.md 参照)。3.5.5 の
      # "Fixed an issue with SNI generation in dbless mode. (#7853)" で修正済み。
      # Kong Operator ではこのバージョンを選べず、本移行の目的そのものが
      # 「KIC のバージョンを自分で決めること」である。パッチまで固定する。
      tag: "3.5.13"

gateway:
  image:
    # ★ こちらも浮動タグ (3.9) を使わないこと。
    # 同じチャートが KIC (controller) と Kong Gateway (gateway) の 2 イメージを
    # 別々のタグ設定として持つ。KIC 側だけ固定して Kong Gateway 側を chart 既定の
    # 浮動タグに任せると、KIC で拒否したのと同じ型のリスク（意図しないマイナー/パッチ
    # を引いて壊れる）をデータプレーン側で再導入してしまう。3.9 系最新パッチで固定する。
    tag: "3.9.3"
  # 旧 platform/kong-gateway/gatewayconfiguration.yaml (Kong Operator の
  # GatewayConfiguration, Task 4 で削除) が持っていた設定を引き継ぐ。
  # replicas: 2 は移行前と同一。Kong のデータプレーンは Argo CD 自身の公開経路
  # でもあり、Pod 1 つの再起動で到達不能になる single point of failure を
  # 作らないため、chart 既定の 1 のままにはしない。
  replicaCount: 2
  resources:
    requests:
      # 移行前 (旧 gatewayconfiguration.yaml) と同一の値。
      cpu: 200m
      memory: 512Mi
    limits:
      # requests と同値にしない。過去に Kong Operator で「requests だけ上書きし
      # limits を chart 既定のまま残した結果、実質 requests=limits で余裕ゼロに
      # なり OOMKilled で 23 回 CrashLoopBackOff した」事故があるため
      # (docs/known-issues.md 参照)、limits は必ず明示しつつ requests から
      # 十分な余白を確保する。
      # cpu: 起動時のコンフィグ再構築やスパイク的なリクエスト増でのスロットリングを
      # 避けるため 2.5 倍の 500m。ノード 1 台 (e2-standard-4 = 4 vCPU) を
      # 専有しない範囲。
      # memory: dbless モードの Kong はルート数の多い宣言的設定の再読み込みで
      # 一時的にメモリ使用が跳ねる。512Mi ぴったりだと張り付いた瞬間に OOM する
      # ため 2 倍の 1Gi を上限にし、突発的な増加を吸収しつつノードの他ワークロード
      # を圧迫しない範囲に留める。
      cpu: 500m
      memory: 1Gi
  proxy:
    type: LoadBalancer
    annotations:
      # Terraform が予約した静的 IP を固定する。この annotation が GKE で
      # 実際に機能することは実機検証済み (35.221.95.244 が割り当たる)。
      cloud.google.com/l4-rbs: "enabled"
      networking.gke.io/load-balancer-ip-addresses: shukawam-gke-gateway
