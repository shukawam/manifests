# kong/ingress は kong サブチャートを controller (KIC) / gateway (Kong Gateway) の
# 2 エイリアスで 2 回インスタンス化する薄いラッパ。

controller:
  ingressController:
    # チャートは genCA と lookup で webhook の証明書を生成するが、Argo CD の
    # repo-server はクラスタ接続なしで helm template するため lookup が常に nil に
    # なり、reconcile のたびに CA が再生成されて恒久 OutOfSync と webhook の TLS
    # 失敗を招く。failurePolicy: Ignore なので壊れても素通りし気づけない。
    # 守る対象の CR (KongPlugin / KongConsumer 等) もクラスタに 0 件。
    admissionWebhook:
      enabled: false
    image:
      # 浮動タグ (3.5) を使わないこと。KIC 3.4.0 で混入した SNI 生成の不具合により、
      # TLS 証明書を付けた Gateway の宣言的設定投入が全件失敗する
      # (docs/known-issues.md)。3.5.5 で修正済み。
      tag: "3.5.13"
    # 未設定だと BestEffort QoS になり、ノード 1 台構成のこのクラスタでは
    # リソース圧迫時に真っ先に evict される。値は実測ではなく Kong Operator の実績
    # (256Mi で OOM、1Gi で安定・実測 127Mi) からの見積もりで、watch 対象が
    # さらに多い KIC 向けに余裕を積んだもの。
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi

gateway:
  # チャート既定 (NodePort) のままだと Kong Manager が全ノードに露出する。
  # 旧構成に無かった露出なので無効化する。
  manager:
    enabled: false
  image:
    # controller と同じ理由で浮動タグ (3.9) を避ける。
    # 注意: 稼働中の DP は kong/kong-gateway (Enterprise) だが、このチャートの
    # image.repository 既定は kong (OSS)。Enterprise 専用プラグイン
    # (RBAC / OIDC / Rate Limiting Advanced 等) は使えなくなる。
    tag: "3.9.3"
  # Kong は Argo CD 自身の公開経路でもあるため、Pod 1 つの再起動で到達不能になる
  # single point of failure を作らないよう、チャート既定の 1 にはしない。
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # requests と同値にはしない。Kong Operator で「requests だけ上書きし limits を
      # チャート既定のまま残した」結果 OOMKilled で 23 回 CrashLoopBackOff した事故が
      # ある (docs/known-issues.md)。値は移行前の DP の実測 limits に合わせており、
      # 移行でキャパシティを削らないための下限でもある。
      cpu: 2
      memory: 2000Mi
  proxy:
    type: LoadBalancer
    annotations:
      # Terraform が予約した静的 IP を固定する
      cloud.google.com/l4-rbs: "enabled"
      networking.gke.io/load-balancer-ip-addresses: shukawam-gke-gateway
