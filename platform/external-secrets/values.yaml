# Secret Manager にアクセスするのはコントローラだけ。
# webhook / cert-controller の SA には annotation を付けない。
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: shukawam-external-secrets@gcp-fieldeng-dev.iam.gserviceaccount.com

extraEnv:
  # 【必須】compute/metadata は OnGCE() の判定をプロセス寿命の間メモ化する。
  # DaemonSet の gke-metadata-server より ESO Pod が先に起動すると「GCE 外」と
  # 判定が固定され、以降 Pod を再起動するまで ADC を取得できない
  # (ClusterSecretStore が Ready=False のまま復旧しない)。この変数があれば
  # 探索を省いて即 true を返すため競合しない。DNS に依存しないよう IP で書く。
  - name: GCE_METADATA_HOST
    value: "169.254.169.254"

resources:
  requests:
    cpu: 20m
    memory: 64Mi
