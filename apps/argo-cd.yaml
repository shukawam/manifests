apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        # bootstrap.sh の `helm upgrade --install argocd` とリリース名を一致させる。
        # 指定しないと Argo CD は Application 名 (argo-cd) をリリース名として使い、
        # チャートの nameOverride (argocd) との組み合わせで argo-cd-argocd-server 等が
        # レンダリングされ、bootstrap が導入した argocd-* を引き取れずに
        # 別名の Argo CD をもう一組作ってしまう。Application 名は暗黙の結合対象にせず、
        # ここで明示的に固定する。
        releaseName: argocd
        valueFiles:
          - $values/platform/argo-cd/values.yaml
    - repoURL: https://github.com/shukawam/manifests.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
