apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.konghq.com
      chart: ingress
      targetRevision: 0.24.0
      helm:
        valueFiles:
          - $values/platform/kong-ingress/values.yaml
    - repoURL: https://github.com/shukawam/manifests.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      # チャートが同梱する configuration.konghq.com の CRD を守る。
      # ただし prune が防ぐのは自動 sync 時の削除だけで、Application 自体を
      # 消したときのカスケード削除は止められない。この 12 CRD には
      # helm.sh/resource-policy: keep が付いていないため、Application を削除すると
      # CRD と該当 CR は消える。保護するなら Delete=false を別途付けること。
      #
      # なお同チャートは kong サブチャートを 2 エイリアスで展開するため CRD が
      # 重複レンダリングされ、sync 時に RepeatedResourceWarning が出ることがある
      # (内容はバイト一致で実害無し)。
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
