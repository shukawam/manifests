apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.konghq.com
      chart: ingress
      targetRevision: 0.24.0
      helm:
        valueFiles:
          - $values/platform/kong-ingress/values.yaml
    - repoURL: https://github.com/shukawam/manifests.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      # CRD を誤って消さないため、このアプリだけ prune しない。
      # kong/ingress チャートは configuration.konghq.com の CRD
      # (kongplugins, kongconsumers, kongclusterplugins 等、計 9 個) を同梱する。
      # prune: true のままだと Application 削除時にこれらの CRD が消え、
      # クラスタ内の該当 CR が連鎖削除される。
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
