apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/shukawam/manifests.git
    targetRevision: main
    path: platform/kong-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # 差分計算もサーバサイド dry-run apply で行う。
      # このアプリの Gateway / HTTPRoute は「自分が書いていないフィールド」を
      # 大量に持つ:
      #   - Gateway: KIC が konghq.com/publish-service アノテーションを追記する
      #   - HTTPRoute: CRD の既定値で matches / weight / group / kind が入る
      # クライアントサイド差分ではこれらが常に差分として残り、selfHeal が
      # 永久に再 apply を繰り返す（Application が OutOfSync のまま固定される）。
      # ServerSideDiff は managedFields を見て他マネージャ所有のフィールドと
      # API サーバの既定値を差分から除外するため、これらが収束する。
      - ServerSideDiff=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
