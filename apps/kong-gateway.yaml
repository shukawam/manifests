apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/shukawam/manifests.git
    targetRevision: main
    path: platform/kong-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Gateway / HTTPRoute には KIC が書き足すアノテーションと CRD 既定値が
      # 入るため、クライアントサイド差分だと恒久 OutOfSync になり selfHeal が
      # 再 apply を繰り返す。
      - ServerSideDiff=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
